<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560" role="img" aria-labelledby="title desc">
  <title id="title">OrientMatch coarse-to-fine search strategy</title>
  <desc id="desc">The coarse stage evaluates all translations for every coarse rotation on a downsampled image. The top K pose candidates are mapped to full resolution and searched within local position and angle neighborhoods.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#6f7c90"/>
    </marker>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#172033" flood-opacity="0.12"/>
    </filter>
    <radialGradient id="peakA">
      <stop offset="0" stop-color="#f77f00" stop-opacity="0.95"/>
      <stop offset="0.35" stop-color="#f4a261" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#fff4e6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="peakB">
      <stop offset="0" stop-color="#457b9d" stop-opacity="0.95"/>
      <stop offset="0.35" stop-color="#72a8c7" stop-opacity="0.62"/>
      <stop offset="1" stop-color="#edf6fb" stop-opacity="0"/>
    </radialGradient>
    <pattern id="smallGrid" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M25 0H0V25" fill="none" stroke="#d5dce7" stroke-width="1"/>
    </pattern>
    <pattern id="fineGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#c8d8e3" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1400" height="560" fill="#f7f9fc"/>
  <text x="700" y="45" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#172033">Search budget is concentrated where the coarse score is promising</text>
  <text x="700" y="73" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" fill="#5f6b7a">global coverage at low resolution → Top K hypotheses → local refinement at full resolution</text>

  <!-- Coarse panel -->
  <g filter="url(#shadow)">
    <rect x="38" y="112" width="560" height="384" rx="18" fill="#ffffff" stroke="#efb26b" stroke-width="2"/>
  </g>
  <rect x="38" y="112" width="560" height="52" rx="18" fill="#f4a261"/>
  <path d="M38 138V164H598V138" fill="#f4a261"/>
  <text x="318" y="144" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#3d2608">1. Coarse: global position × angle</text>
  <rect x="67" y="191" width="350" height="250" rx="8" fill="url(#smallGrid)" stroke="#b8c1cf"/>
  <ellipse cx="294" cy="279" rx="82" ry="72" fill="url(#peakA)"/>
  <ellipse cx="150" cy="369" rx="58" ry="54" fill="url(#peakA)" opacity="0.62"/>
  <ellipse cx="374" cy="392" rx="46" ry="40" fill="url(#peakA)" opacity="0.48"/>
  <circle cx="294" cy="279" r="8" fill="#ffffff" stroke="#b85c00" stroke-width="3"/>
  <circle cx="150" cy="369" r="6" fill="#ffffff" stroke="#b85c00" stroke-width="2"/>
  <circle cx="374" cy="392" r="6" fill="#ffffff" stroke="#b85c00" stroke-width="2"/>
  <text x="242" y="465" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" fill="#5f6b7a">complete translation score map at each coarse angle</text>

  <g transform="translate(449 193)" font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="59" y="0" text-anchor="middle" font-size="13" font-weight="700" fill="#6b3a00">rotated template bank</text>
    <g transform="translate(13 22)">
      <rect width="92" height="54" rx="8" fill="#fff7ed" stroke="#f4a261"/>
      <g transform="translate(46 27) rotate(0)"><path d="M-20-11H4V-4H-12V11H-20Z" fill="#c66a08"/><circle cx="16" cy="6" r="7" fill="#e5943c"/></g>
      <text x="46" y="70" text-anchor="middle" font-size="11" fill="#7a4200">θ₀</text>
    </g>
    <g transform="translate(13 112)">
      <rect width="92" height="54" rx="8" fill="#fff7ed" stroke="#f4a261"/>
      <g transform="translate(46 27) rotate(24)"><path d="M-20-11H4V-4H-12V11H-20Z" fill="#c66a08"/><circle cx="16" cy="6" r="7" fill="#e5943c"/></g>
      <text x="46" y="70" text-anchor="middle" font-size="11" fill="#7a4200">θ₀ + Δθ</text>
    </g>
    <g transform="translate(13 202)">
      <rect width="92" height="54" rx="8" fill="#fff7ed" stroke="#f4a261"/>
      <g transform="translate(46 27) rotate(48)"><path d="M-20-11H4V-4H-12V11H-20Z" fill="#c66a08"/><circle cx="16" cy="6" r="7" fill="#e5943c"/></g>
      <text x="46" y="70" text-anchor="middle" font-size="11" fill="#7a4200">θ₀ + 2Δθ</text>
    </g>
  </g>

  <!-- Top K bridge -->
  <path d="M598 304H641" fill="none" stroke="#6f7c90" stroke-width="3" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)">
    <rect x="653" y="226" width="118" height="156" rx="18" fill="#ffffff" stroke="#cdd5e1"/>
  </g>
  <text x="712" y="258" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#5f6b7a">RANK</text>
  <text x="712" y="296" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="29" font-weight="800" fill="#2f3e5c">Top K</text>
  <circle cx="683" cy="331" r="10" fill="#f77f00"/><text x="704" y="336" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" fill="#5f6b7a">pose 1</text>
  <circle cx="683" cy="357" r="8" fill="#f4a261"/><text x="704" y="362" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" fill="#5f6b7a">pose 2…</text>
  <path d="M771 304H814" fill="none" stroke="#6f7c90" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Fine panel -->
  <g filter="url(#shadow)">
    <rect x="826" y="112" width="536" height="384" rx="18" fill="#ffffff" stroke="#72a8c7" stroke-width="2"/>
  </g>
  <rect x="826" y="112" width="536" height="52" rx="18" fill="#72a8c7"/>
  <path d="M826 138V164H1362V138" fill="#72a8c7"/>
  <text x="1094" y="144" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#102e40">2. Fine: local position × neighboring angles</text>
  <rect x="862" y="191" width="288" height="250" rx="8" fill="url(#fineGrid)" stroke="#9fb4c4"/>
  <rect x="919" y="237" width="174" height="158" rx="7" fill="#dceff8" fill-opacity="0.46" stroke="#457b9d" stroke-width="3" stroke-dasharray="8 5"/>
  <ellipse cx="1017" cy="311" rx="61" ry="54" fill="url(#peakB)"/>
  <circle cx="1017" cy="311" r="8" fill="#ffffff" stroke="#245672" stroke-width="3"/>
  <path d="M995 311H1039 M1017 289V333" stroke="#245672" stroke-width="1.5" opacity="0.65"/>
  <text x="1006" y="465" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" fill="#5f6b7a">small full-resolution ROI around each coarse pose</text>

  <g transform="translate(1180 200)" font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="73" y="0" text-anchor="middle" font-size="13" font-weight="700" fill="#245672">fine angle neighborhood</text>
    <path d="M10 77H136" stroke="#8aa9bc" stroke-width="3"/>
    <g fill="#457b9d">
      <circle cx="18" cy="77" r="5"/><circle cx="46" cy="77" r="5"/><circle cx="73" cy="77" r="8"/><circle cx="100" cy="77" r="5"/><circle cx="128" cy="77" r="5"/>
    </g>
    <g text-anchor="middle" font-size="11" fill="#5f6b7a">
      <text x="18" y="100">−2°</text><text x="46" y="100">−1°</text><text x="73" y="100">θ</text><text x="100" y="100">+1°</text><text x="128" y="100">+2°</text>
    </g>
    <rect x="3" y="137" width="140" height="82" rx="11" fill="#e9f7ef" stroke="#56a878"/>
    <text x="73" y="164" text-anchor="middle" font-size="12" font-weight="700" fill="#31704b">RETURN BEST</text>
    <text x="73" y="189" text-anchor="middle" font-size="14" font-weight="700" fill="#145c35">(x, y, θ, score)</text>
  </g>

  <text x="700" y="535" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" fill="#7d8795">Heuristic search: faster than full-resolution exhaustive evaluation, but a narrow optimum can be missed.</text>
</svg>
